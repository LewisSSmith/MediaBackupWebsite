<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Photo Locations Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Leaflet CSS/JS from CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />

    <!-- MarkerCluster plugin - groups nearby pins so the map isn't cluttered -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/mediaviewer.css" />
    <link rel="stylesheet" href="css/map.css" />
  </head>

  <body>
    <div id="navbar"></div>
    <div id="map-wrapper">
      <div id="status">Loading photo locations…</div>
      <div id="map"></div>
    </div>

    <div id="modalContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

    <script src="js/main.js"></script>
    <script src="js/config.js"></script>
    <script src="js/navbar.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js"></script>
    <script src="https://unpkg.com/exifr/dist/full.umd.js"></script>
    <script src="js/file-utils.js"></script>
    <script src="js/mediaviewer.js"></script>
    <script src="js/map.js"></script>
  </body>
</html>
